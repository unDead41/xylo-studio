name: Digital studio
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-auth.mjs --check
      - run: node supabase/templates/build-config.mjs --check
      - run: node --test tests/*.test.cjs tests/auth/*.test.cjs tests/auth-providers/*.test.cjs
